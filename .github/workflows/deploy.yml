name: Deploy to ECS

on:
push:
branches:
- main

permissions:
id-token: write
contents: read

env:
AWS_REGION: ap-south-1
ECR_REPOSITORY: demo
ECS_CLUSTER: ABHI_Cluster
ECS_SERVICE: flask_app-service-2b5behat
ECS_TASK_DEFINITION: flask_app
CONTAINER_NAME: flask

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
- name: Checkout Source Code
  uses: actions/checkout@v4

- name: Configure AWS Credentials
  uses: aws-actions/configure-aws-credentials@v4
  with:
    role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
    aws-region: ${{ env.AWS_REGION }}

- name: Login to Amazon ECR
  id: login-ecr
  uses: aws-actions/amazon-ecr-login@v2

- name: Set Image Tag
  run: |
    echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

- name: Build Docker Image
  run: |
    docker build -t $ECR_REPOSITORY:$IMAGE_TAG .

- name: Tag Docker Image
  run: |
    docker tag $ECR_REPOSITORY:$IMAGE_TAG \
    ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

- name: Push Docker Image
  run: |
    docker push \
    ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

- name: Download Current Task Definition
  run: |
    aws ecs describe-task-definition \
      --task-definition $ECS_TASK_DEFINITION \
      --query taskDefinition \
      > task-definition.json

- name: Update ECS Task Definition Image
  id: task-def
  uses: aws-actions/amazon-ecs-render-task-definition@v1
  with:
    task-definition: task-definition.json
    container-name: ${{ env.CONTAINER_NAME }}
    image: ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

- name: Deploy ECS Task Definition
  uses: aws-actions/amazon-ecs-deploy-task-definition@v2
  with:
    task-definition: ${{ steps.task-def.outputs.task-definition }}
    service: ${{ env.ECS_SERVICE }}
    cluster: ${{ env.ECS_CLUSTER }}
    wait-for-service-stability: true
```
